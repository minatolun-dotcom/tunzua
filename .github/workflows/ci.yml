name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        run: bash scripts/smoke-test.sh

  cross-browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (+ system deps)
        run: npx playwright-core install --with-deps chromium firefox webkit

      - name: Run cross-browser suite (Chromium + Firefox + WebKit)
        run: node scripts/xbrowser.js

      - name: Generator tests (5 suites)
        # All run against temp dirs with fixture files and a monkeypatched
        # fetch() where network would be needed — the real repo is never
        # read or written. Monthly self-registration drives the rendered
        # page in a real browser (skips gracefully when absent).
        run: |
          python3 scripts/test-monthly-topics.py && \
          python3 scripts/test-blog-index.py && \
          python3 scripts/test-feed-sitemap.py && \
          python3 scripts/test-pipeline.py && \
          python3 scripts/test-quiet-day.py

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Lighthouse
        run: npx playwright-core install chromium

      - name: Run Lighthouse audit with score budgets
        run: bash scripts/lighthouse-ci.sh
