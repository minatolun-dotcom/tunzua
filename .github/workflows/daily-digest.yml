name: Daily Tax Digest

on:
  schedule:
    # 02:30 UTC = 8:00 AM IST — daily morning digest
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two digest jobs at once (e.g. a manual dispatch overlapping the
# scheduled run) — a collision could race the commit/push and lose a digest.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install image-render deps (pillow, fonttools, brotli)
        run: pip install --quiet --break-system-packages pillow fonttools brotli

      - name: Sanity check generator before publishing
        # If a generator edit is broken, fail BEFORE writing a bad commit —
        # not after CI catches it on the pushed commit. All suites run offline
        # against temp dirs (no network, repo untouched); the monthly suite's
        # browser layer skips gracefully when chromium is absent.
        run: |
          set -euo pipefail
          python3 scripts/test-blog-index.py
          python3 scripts/test-feed-sitemap.py
          python3 scripts/test-pipeline.py
          python3 scripts/test-quiet-day.py
          python3 scripts/test-post-template.py
          python3 scripts/test-monthly-topics.py

      - name: Generate digest (and email the summary to the firm)
        env:
          # Optional override: set a DIGEST_EMAIL_TO secret to change the
          # recipient; defaults to info@tunzua.com inside the script.
          DIGEST_EMAIL_TO: ${{ secrets.DIGEST_EMAIL_TO }}
          # Page-view counter (GoatCounter). When set, new digest posts carry
          # the tracker + a live view count; leave empty to disable. Posts
          # already published were backfilled by scripts/enable-counter.py.
          GOATCOUNTER_SITE: tunzua
        run: |
          set -o pipefail
          python3 scripts/generate-digest.py --email 2>&1 | tee /tmp/digest.log
        # The generator returns 0 even on quiet days (nothing to publish);
        # it returns 2 only if every feed failed (nothing sensible to do).
        # pipefail surfaces a generator crash instead of tee's exit code.
        # --email is best-effort (never blocks publishing).

      - name: Commit and push if a digest was published
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "Tunzua Digest Bot"
            git config user.email "digest-bot@tunzua.com"
            git add -A
            git commit -m "Publish daily tax news digest ($(date -u +%Y-%m-%d))"
            # A transient push failure (network blip, rate limit) must not
            # lose the digest: retry a few times, then verify the remote
            # actually has our commit before calling it done.
            for attempt in 1 2 3; do
              # Push the explicit branch: never depends on the local branch
              # having upstream-tracking configured (plain `git push` would).
              if GIT_TERMINAL_PROMPT=0 git push origin main 2>/tmp/push.err; then
                if git fetch -q origin && git merge-base --is-ancestor HEAD origin/main; then
                  echo "Pushed digest commit (attempt $attempt)"
                  break
                fi
                echo "Push returned success but origin/main is behind HEAD — retrying" >&2
              else
                # tail -n2|head -n1 picks the last non-blank stderr line, so
                # transient failures are diagnosable (tail -1 can be empty).
                echo "Push attempt $attempt failed: $(tail -n 2 /tmp/push.err | head -n 1)" >&2
              fi
              [ "$attempt" -lt 3 ] && sleep 15
            done
            # Final verification: fail loudly if the commit still isn't remote.
            git fetch -q origin || true
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Digest commit confirmed on origin/main"
            else
              echo "ERROR: digest commit was not pushed to origin/main" >&2
              exit 1
            fi
          else
            echo "No changes — quiet news day or nothing new; skipping push"
          fi

      - name: Summarize
        # Show the tail of the digest log even when an earlier step failed
        # (e.g. a push that never confirmed), so the failure is diagnosable.
        if: always()
        run: |
          if [ -f /tmp/digest.log ]; then tail -8 /tmp/digest.log; fi
